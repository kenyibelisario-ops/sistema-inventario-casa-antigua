<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Clientes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #2e1b14; color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card-cafe { background-color: #3b2219; border: 1px solid #523124; border-radius: 12px; color: #ffffff; box-shadow: 0 4px 15px rgba(0,0,0,0.5); width: 100%; max-width: 400px; padding: 30px; }
        .form-control { background-color: #2e1b14; border: 1px solid #523124; color: #fff; border-radius: 8px; }
        .form-control:focus { background-color: #2e1b14; border-color: #e5c158; color: #fff; box-shadow: 0 0 0 0.25rem rgba(212,175,55,0.25); }
        .form-label { color: #e5c158; font-weight: 600; }
        .btn-dorado { background-color: #d4af37; color: #1a0f0a; font-weight: bold; border: none; border-radius: 8px; width: 100%; padding: 10px; }
        .btn-dorado:hover { background-color: #e5c158; color: #1a0f0a; }
        .text-dorado { color: #e5c158 !important; }
    </style>
</head>
<body>
    <div class="card-cafe">
        <h3 class="fw-bold text-dorado text-center mb-3">Iniciar Sesión</h3>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-danger py-2 mb-3 text-center" style="font-size: 0.85rem; background-color: #523124; border-color: #7a4835; color: #ffcccc;">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Correo Electrónico</label>
                <input type="email" class="form-control" name="correo" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Contraseña</label>
                <input type="password" class="form-control" name="contrasena" required>
            </div>
            <button type="submit" class="btn btn-dorado mb-3">Ingresar</button>
        </form>

        <div class="text-center" style="font-size: 0.85rem;">
            <p class="mb-1">¿No tienes cuenta? <a href="/cliente-registro" class="text-warning">Regístrate aquí</a></p>
            <a href="/" class="text-light opacity-75">Volver al inicio</a>
        </div>
    </div>
</body>
</html>
