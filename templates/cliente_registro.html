<!-- Formulario de autorregistro para nuevos clientes del sistema, -->
<!-- capturando datos personales y credenciales de acceso. -->

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Clientes</title>
    <!-- Framework Bootstrap para maquetación responsiva -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { 
            margin: 0;
            padding: 0;
            height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(rgba(46, 27, 20, 0.82), rgba(46, 27, 20, 0.82)), 
                        url('https://images.unsplash.com/photo-1501339847302-ac426a4a7cbb?auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
            color: #f8f9fa;
        }
        .card-cafe { 
            background-color: rgba(59, 34, 25, 0.92); 
            border: 1px solid #523124; 
            border-radius: 12px; 
            color: #ffffff; 
            box-shadow: 0 8px 25px rgba(0,0,0,0.7); 
            width: 100%; 
            max-width: 420px; 
            padding: 30px; 
            backdrop-filter: blur(4px);
        }
        .form-control { background-color: #2e1b14; border: 1px solid #523124; color: #fff; border-radius: 8px; }
        .form-control:focus { background-color: #2e1b14; border-color: #e5c158; color: #fff; box-shadow: 0 0 0 0.25rem rgba(212,175,55,0.25); }
        .form-label { color: #e5c158; font-weight: 600; }
        .btn-dorado { background-color: #d4af37; color: #1a0f0a; font-weight: bold; border: none; border-radius: 8px; width: 100%; padding: 10px; }
        .btn-dorado:hover { background-color: #e5c158; color: #1a0f0a; }
        .text-dorado { color: #e5c158 !important; }
    </style>
</head>
<body>
    <div class="card-cafe">
        <h3 class="fw-bold text-dorado text-center mb-3">Registro de Cliente</h3>
        
        <!-- Bloque de control de errores mediante mensajes flash -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-danger py-2 mb-3 text-center" style="font-size: 0.85rem; background-color: #523124; border-color: #7a4835; color: #ffcccc;">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <!-- Formulario POST que envía los datos del nuevo cliente al controlador de registro -->
        <form method="POST">
            <div class="mb-2">
                <label class="form-label">Nombre</label>
                <input type="text" class="form-control" name="nombre" required>
            </div>
            <div class="mb-2">
                <label class="form-label">Apellido</label>
                <input type="text" class="form-control" name="apellido" required>
            </div>
            <div class="mb-2">
                <label class="form-label">Correo Electrónico</label>
                <input type="email" class="form-control" name="correo" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Contraseña</label>
                <input type="password" class="form-control" name="contrasena" required>
            </div>
            <button type="submit" class="btn btn-dorado mb-3">Registrarse</button>
        </form>

        <div class="text-center" style="font-size: 0.85rem;">
            <p class="mb-2">¿Ya tienes cuenta? <a href="/cliente-login" class="text-warning fw-bold text-decoration-none">Inicia sesión</a></p>
            <a href="/" class="btn btn-outline-light btn-sm w-100 mt-2" style="border-color: #523124; font-size: 0.8rem;">← Volver a la página principal</a>
        </div>
    </div>
</body>
</html>
