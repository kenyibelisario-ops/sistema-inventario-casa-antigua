<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Pedidos - Café-Casa Antigua</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { 
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            background: linear-gradient(rgba(46, 27, 20, 0.85), rgba(46, 27, 20, 0.85)), 
                        url('https://images.unsplash.com/photo-1501339847302-ac426a4a7cbb?auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #f8f9fa; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        }
        .card-cafe { background-color: rgba(59, 34, 25, 0.92); border: 1px solid #523124; border-radius: 12px; color: #ffffff; box-shadow: 0 4px 15px rgba(0,0,0,0.5); backdrop-filter: blur(4px); }
        .text-dorado { color: #e5c158 !important; }
        .text-claro-sub { color: rgba(255, 255, 255, 0.75) !important; }
    </style>
</head>
<body>
    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4 p-3 card-cafe">
            <div>
                <h3 class="fw-bold text-dorado m-0">📦 Historial de Mis Pedidos</h3>
                <p class="text-claro-sub m-0" style="font-size: 0.9rem;">Cliente: <strong>{{ session.get('cliente_nombre') }}</strong></p>
            </div>
            <div>
                <a href="/catalogo" class="btn btn-outline-warning btn-sm">← Volver al Menú</a>
            </div>
        </div>

        <div class="card-cafe p-3">
            <div class="table-responsive">
                <table class="table table-dark table-sm align-middle" style="background-color: transparent; font-size: 0.9rem;">
                    <thead>
                        <tr class="text-warning">
                            <th>Fecha</th>
                            <th>Detalle</th>
                            <th>Total</th>
                            <th>Estatus</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for p in pedidos %}
                        <tr>
                            <td>{{ p.fecha }}</td>
                            <td>{{ p.detalle }}</td>
                            <td class="text-success fw-bold">${{ "%.2f"|format(p.total) }}</td>
                            <td>
                                <span class="badge {% if p.estatus == 'Pagado' %}bg-success{% else %}bg-warning text-dark{% endif %}">
                                    {{ p.estatus }}
                                </span>
                            </td>
                        </tr>
                        {% else %}
                        <tr>
                            <td colspan="4" class="text-center text-muted py-4">No has realizado ningún pedido todavía.</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
