<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Café-Casa Antigua</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #2e1b14; color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0; }
        .card-cafe { background-color: #3b2219; border: 1px solid #523124; border-radius: 12px; color: #ffffff; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .form-control { background-color: #2e1b14; border: 1px solid #523124; color: #fff; border-radius: 8px; }
        .form-control:focus { background-color: #2e1b14; border-color: #e5c158; color: #fff; box-shadow: 0 0 0 0.25rem rgba(212,175,55,0.25); }
        .form-label { color: #e5c158; font-weight: 600; }
        .btn-dorado { background-color: #d4af37; color: #1a0f0a; font-weight: bold; border: none; border-radius: 8px; }
        .btn-dorado:hover { background-color: #e5c158; color: #1a0f0a; }
        .text-dorado { color: #e5c158 !important; }
        .login-card { width: 100%; max-width: 420px; padding: 40px; }
    </style>
</head>
<body>
    <div class="card-cafe login-card text-center">
        <div class="fs-1 mb-2">☕</div>
        <h3 class="fw-bold mb-1 text-dorado">Café-Casa Antigua</h3>
        <p class="text-light opacity-75 mb-4" style="font-size: 0.85rem;">Sistema de Control de Inventario</p>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-danger py-2 mb-3 text-center" style="font-size: 0.85rem; background-color: #523124; border-color: #7a4835; color: #ffcccc;">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form action="/login" method="POST" class="text-start">
            <div class="mb-3">
                <label class="form-label">USUARIO</label>
                <input type="text" class="form-control" name="usuario" placeholder="Ej. admin o empleado" required autocomplete="off">
            </div>
            <div class="mb-4">
                <label class="form-label">CONTRASEÑA</label>
                <input type="password" class="form-control" name="contrasena" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-dorado w-100 py-2 mb-3">Ingresar al Sistema</button>
        </form>

        <hr class="border-secondary opacity-25 my-3">
        <a href="/catalogo" class="btn btn-outline-warning w-100 text-decoration-none" style="color: #d4af37; border-color: #d4af37;">
            ← Ver Catálogo en Línea (Clientes)
        </a>
    </div>
</body>
</html>
