<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Café-Casa Antigua</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(rgba(46, 27, 20, 0.75), rgba(46, 27, 20, 0.75)), 
                        url("{{ url_for('static', filename='images.jfif') }}");
            background-size: cover;
            background-position: center;
            color: #f8f9fa;
        }
        .admin-link {
            position: absolute;
            top: 20px;
            right: 25px;
            background-color: #3b2219;
            color: #d4af37;
            border: 1px solid #523124;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            text-decoration: none;
        }
        .admin-link:hover {
            color: #e5c158;
            border-color: #d4af37;
        }
        .main-box {
            text-align: center;
            padding: 20px;
        }
        .welcome-heading {
            font-size: 3.5rem;
            font-weight: 700;
            color: #d4af37;
            margin-bottom: 20px;
        }
        .btn-custom-catalogo {
            background-color: #d4af37;
            color: #1a0f0a;
            font-weight: bold;
            font-size: 0.95rem;
            border: none;
            border-radius: 8px;
            padding: 10px 24px;
            text-decoration: none;
            display: inline-block;
        }
        .btn-custom-catalogo:hover {
            background-color: #e5c158;
            color: #1a0f0a;
        }
    </style>
</head>
<body>
    <a href="/login" class="admin-link">Área de administración</a>

    <div class="main-box">
        <h1 class="welcome-heading">Bienvenido</h1>
        <a href="/catalogo" class="btn-custom-catalogo">Catálogo en línea</a>
    </div>
</body>
</html>
